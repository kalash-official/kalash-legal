<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verify OTP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Roboto,system-ui,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:linear-gradient(135deg,#e3f2fd,#fce4ec);
}

.container{
  max-width:420px;
  width:100%;
  padding:28px;
  text-align:center;
  animation:fadeIn .6s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

h1{
  font-size:30px;
  margin-bottom:6px;
  color:#1a237e;
}

.subtitle{
  color:#546e7a;
  margin-bottom:28px;
  font-size:15px;
}

.card{
  padding:24px;
  border-radius:18px;
  background:white;
  box-shadow:0 12px 30px rgba(0,0,0,0.12);
}

.input-wrapper{
  border:1.8px solid #e0e0e0;
  border-radius:12px;
  padding:12px 14px;
  background:#fafafa;
  transition:.2s;
}

.input-wrapper:focus-within{
  border-color:#2196F3;
  background:#fff;
}

.input-wrapper input{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  font-size:17px;
  padding:6px 4px;
  color:#212121;
}

.resend{
  margin-top:16px;
  color:#607d8b;
  font-size:14px;
}

.resend span{
  color:#1e88e5;
  font-weight:600;
  cursor:pointer;
}

.timer{
  margin:20px 0;
  color:#546e7a;
  font-size:14px;
}

button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#2196F3,#1e88e5);
  color:white;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(33,150,243,0.4);
  transition:.2s;
}

button:hover{transform:translateY(-1px)}
button:active{transform:scale(0.97)}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:20px;
  backdrop-filter:blur(4px);
}
</style>
</head>

<body>

<div class="container">
  <h1>Verify OTP</h1>
  <div class="subtitle">Enter the code sent to your phone</div>

  <div class="card">
    <div class="input-wrapper">
      <input id="otp" type="number" placeholder="Enter OTP">
    </div>
    <div class="resend">Didn't receive? <span id="resend">Resend</span></div>
  </div>

  <div class="timer" id="timer">02:00</div>
  <button id="verifyBtn">Verify and Continue</button>
</div>

<div class="overlay" id="overlay">Verifying OTP...</div>

<script>
/* Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyAUTZtR_9sM-EXq-AChMtYNh-XBpHXFs3E",
  authDomain: "kalash2-2bf90.firebaseapp.com",
  projectId: "kalash2-2bf90",
  appId: "kalash2-2bf90"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* Elements */
const otpInput = document.getElementById("otp");
const resend = document.getElementById("resend");
const timerEl = document.getElementById("timer");
const overlay = document.getElementById("overlay");
const verifyBtn = document.getElementById("verifyBtn");

const verificationId = localStorage.getItem("verificationId");
let time = 120;
let interval;

/* Start Timer */
startTimer();

/* Resend */
resend.onclick = () => window.location.href = "login.html";

/* Verify */
verifyBtn.onclick = verifyOtp;

function startTimer(){
  resend.style.pointerEvents="none";
  resend.style.color="#757575";
  interval = setInterval(()=>{
    if(time>0){
      time--;
      const m = String(Math.floor(time/60)).padStart(2,'0');
      const s = String(time%60).padStart(2,'0');
      timerEl.innerText = `${m}:${s}`;
    } else {
      clearInterval(interval);
      resend.style.pointerEvents="auto";
      resend.style.color="#1e88e5";
      timerEl.style.display="none";
    }
  },1000);
}

async function verifyOtp(){
  const otp = otpInput.value.trim();
  if(!otp || !verificationId) return alert("Enter OTP");

  overlay.style.display="flex";
  verifyBtn.disabled=true;

  try{
    const cred = firebase.auth.PhoneAuthProvider.credential(verificationId, otp);
    const res = await auth.signInWithCredential(cred);
    const phone = res.user.phoneNumber;

    const snap = await db.collection("users").where("number","==",phone).get();

    if(snap.empty){
      await commonCode(phone);
    } else {
      snap.forEach(d=>{
        const lvl = parseInt(d.data().level);
        if(lvl===1) window.location.href="complete_profile.html";
        if(lvl===2) window.location.href="create_pin.html";
      });
    }
  } catch(e){
    alert("Verification failed");
  }

  overlay.style.display="none";
  verifyBtn.disabled=false;
}

async function commonCode(phone){
  const cs = await db.collection("compnay_setting").get();

  if(cs.empty){
    await db.collection("compnay_setting").add({
      compnay_gmail:"aashishmahto00037@gmail.com",
      compnay_upi_id:"9821668836@apl",
      support_gmail:"support@gmail.com",
      live_srno:0,
      base_capital:30000,
      verification_gmail:"documentverification@gmail.com"
    });
    return commonCode(phone);
  }

  await db.collection("users").add({
    level:"1",
    number:phone,
    profile_status:"not completed",
    verification_status:"not completed",
    first_level_sigup_time: firebase.firestore.FieldValue.serverTimestamp()
  });

  localStorage.setItem("login_status","otp_complete");
  window.location.href="complete_profile.html";
}
</script>

</body>
</html>
