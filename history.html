<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profit Card</title>
<style>
    body { font-family: Arial,sans-serif; background:#f3f3f3; padding:20px; }
    .list { display:flex; flex-direction:column; gap:16px; }

    .card {
        background:white;
        border-radius:12px;
        padding:16px;
        max-width:420px;
        margin:auto;
        box-shadow:0 2px 6px rgba(0,0,0,0.15);
        cursor:pointer;
    }

    .row { display:flex; justify-content:space-between; align-items:center; }
    .company { font-size:18px; font-weight:bold; }
    .price { color:#2e7d32; font-weight:bold; }
    .divider { height:1px; background:#e0e0e0; margin:12px 0; }
    .profit-value { color:#4caf50; font-weight:bold; }
    .dist-text { font-weight:bold; font-size:16px; }
    .profiles { display:flex; justify-content:space-between; margin-top:12px; padding:12px; background:#fafafa; border-radius:8px; }
    .profile { text-align:center; flex:1; }
    .avatar { position:relative; display:inline-block; }
    .avatar img { width:48px; height:48px; border-radius:50%; }
    .badge { position:absolute; top:-4px; right:-4px; background:white; border-radius:50%; padding:2px 4px; font-size:10px; color:#4caf50; border:1px solid #ddd; }
    .amount { color:#2e7d32; font-size:13px; margin-top:6px; }
    .status { font-size:12px; margin-top:4px; }
    .btn { margin-top:6px; background:#4caf50; border:none; color:white; padding:6px 14px; border-radius:18px; font-size:12px; }
    .uid { margin-top:12px; font-weight:bold; color:#666; }
</style>
</head>
<body>

<div class="list" id="list"></div>

<script>
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUTZtR_9sM-EXq-AChMtYNh-XBpHXFs3E",
  authDomain: "kalash2-2bf90.firebaseapp.com",
  projectId: "kalash2-2bf90",
  storageBucket: "kalash2-2bf90.firebasestorage.app",
  messagingSenderId: "462798382911",
  appId: "1:462798382911:web:0cb93d05089de80dd3d58a"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("list");
const usDid = localStorage.getItem("us_did");

if (!usDid) {
  alert("No us_did in localStorage");
  throw new Error("Missing us_did");
}

const snap = await getDocs(collection(db, "users_setting", usDid, "trade_history"));

snap.forEach(doc => {
  const data = doc.data();
  const resultType = data.result_type || data.result || "unknown";

  // Store in localStorage
  localStorage.setItem(`trade_${doc.id}_result`, resultType);
  localStorage.setItem(`trade_${doc.id}_us_did`, usDid);

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class="row">
        <div class="company">${data.name || "Company"}</div>
        <div class="price">${resultType}</div>
    </div>

    <div class="divider"></div>

    <div class="row">
        <div>Result</div>
        <div class="profit-value">${resultType}</div>
    </div>

    <div class="profiles">
      <div class="profile">
        <div class="avatar"><img src="profile.png"><span class="badge">✔</span></div>
        <div class="status">${resultType}</div>
      </div>
    </div>

    <div class="uid">UID: ${usDid}</div>
  `;

  card.addEventListener("click", () => alert("Clicked trade " + doc.id + " → " + resultType));

  list.appendChild(card);
});
</script>

</body>
</html>
