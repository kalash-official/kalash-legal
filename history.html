<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trade History</title>

<style>
body {
  font-family: "Inter", Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}

.list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.card {
  background: #ffffff;
  border-radius: 18px;
  padding: 18px;
  max-width: 420px;
  margin: auto;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.company {
  font-size: 17px;
  font-weight: 700;
  color: #1f2937;
}

.top-right {
  font-size: 13px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 10px;
  background: #fdecea;
}

.green { color: #16a34a; background: #e7f8ee; }
.red { color: #dc2626; background: #fdeaea; }
.gray { color: #6b7280; background: #f1f5f9; }

.divider {
  height: 1px;
  background: #e5e7eb;
  margin: 14px 0;
}

.muted {
  color: #6b7280;
  font-size: 12px;
}

.label {
  color: #374151;
  font-size: 13px;
  font-weight: 600;
}

.profit {
  font-size: 15px;
  font-weight: 700;
}

.dist {
  margin-top: 14px;
  font-size: 14px;
  font-weight: 700;
  color: #111827;
}

.profiles {
  display: flex;
  gap: 12px;
  margin-top: 12px;
  padding: 14px;
  background: #f9fafb;
  border-radius: 14px;
}

.profile {
  text-align: center;
  flex: 1;
}

.avatar {
  position: relative;
  display: inline-block;
}

.avatar img {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 2px solid #e5e7eb;
}

.pin {
  position: absolute;
  top: -14px;                
  left: 50%;
  transform: translateX(-50%);
  background: #d1fae5;       
  color: #065f46;
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 10px;
  font-weight: 600;
  border: 1px solid #6ee7b7;
  white-space: nowrap;
}



.badge {
  position: absolute;
  bottom: -6px;
  right: -6px;
  background: #16a34a;
  color: #fff;
  border-radius: 50%;
  padding: 2px 5px;
  font-size: 10px;
  border: 2px solid #fff;
  display: none;
}

.amount {
  margin-top: 6px;
  font-size: 13px;
  font-weight: 600;
  color: #111827;
}

.status {
  font-size: 11px;
  color: #6b7280;
  margin-top: 2px;
}

.wa_number {
  font-size: 11px;
  color: #4b5563;
}

.hint {
  margin-top: 14px;
  text-align: center;
  color: #6b7280;
  font-size: 11px;
}

.uid {
  margin-top: 10px;
  color: #9ca3af;
  font-weight: 500;
  font-size: 11px;
  text-align: center;
}
@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  .card {
    max-width: 100%;
    padding: 14px;
    border-radius: 14px;
  }

  .company {
    font-size: 15px;
  }

  .top-right {
    font-size: 11px;
    padding: 3px 8px;
  }

  .profiles {
    padding: 10px;
    gap: 8px;
  }

  .avatar img {
    width: 48px;
    height: 48px;
  }

  .amount {
    font-size: 12px;
  }

  .status,
  .wa_number {
    font-size: 10px;
  }

  .hint,
  .uid {
    font-size: 10px;
  }
}

@media (min-width: 900px) {
  .card {
    max-width: 460px;
  }
}

  
  
</style>
</head>

<body>
<div class="list" id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUTZtR_9sM-EXq-AChMtYNh-XBpHXFs3E",
  authDomain: "kalash2-2bf90.firebaseapp.com",
  projectId: "kalash2-2bf90",
  storageBucket: "kalash2-2bf90.firebasestorage.app",
  messagingSenderId: "462798382911",
  appId: "1:462798382911:web:0cb93d05089de80dd3d58a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const list = document.getElementById("list");
const usDid = localStorage.getItem("us_did");

async function loadTrades() {
  const snap = await getDocs(collection(db, "users_setting", usDid, "trade_history"));

  if (snap.empty) {
    list.innerHTML = "<p style='text-align:center;color:#777;'>No trades found</p>";
    return;
  }

  snap.forEach(doc => {
    const d = doc.data();
    const his_did = doc.id;
    let html = "";

    if (d.result === "positive") html = buildCardPositive(d, his_did);
    else if (d.result === "negative" || d.result === "incomplete negative") html = buildCardNegative(d, his_did);
    else if (d.result === "cancel") html = buildCardCancel(d, his_did);
    else if (d.result === "incomplete positive") html = buildCardIncompletePositive(d, his_did);
    else html = buildCardDefault(d, his_did);

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = html;
    list.appendChild(card);
  });
}

/* POSITIVE */
function buildCardPositive(d) {
  return `
    <div class="row">
      <div class="company">${d.name || "Company"}</div>
      <div class="top-right green">₹ ${d.result || "---"}</div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="muted">Entry: ${d.entry_at || "---"}</div>
      <div class="muted">Exit: ${d.exit_at || "---"}</div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="label">Profit</div>
      <div class="profit green">₹ ${d.profit || "---"}</div>
    </div>
    ${partnersUI(d)}
  `;
}

/* NEGATIVE */
function buildCardNegative(d, his_did) {
  const firstAmt = Number(d.daynaiwalaFirstAmount || 0);
  const secondAmt = Number(d.daynaiwalaSecondAmount || 0);

  return `
    <div class="row">
      <div class="company">${d.name || "Company"}</div>
      <div class="top-right red">${d.result || "---"}</div>
    </div>

    <div class="divider"></div>

    <div class="row">
      <div class="muted">Entry: ${d.entry_at || "---"}</div>
      <div class="muted">Exit: ${d.exit_at || "---"}</div>
    </div>

    <div class="divider"></div>

    <div class="row">
      <div class="label">Loss (with included all charges)</div>
      <div class="profit red"> ${firstAmt + secondAmt}</div>
    </div>

    <div class="dist"><div>Loss Distribution</div></div>

    <div class="profiles">

      <div class="profile">
        <div class="avatar">
          <span class="pin">PIN : ${d.otp_first}</span>
          <img src="profile.png">
          <span class="badge" style="display:${d.paymentStatusFirst === "false" ? "none" : "inline"}">✔</span>
        </div>
        <div class="amount"> ${d.daynaiwalaFirstAmount || "---"}</div>
        <div class="status">${String(d.daynaiwalaFirstUsdid) === "null" ? "Pending" : "Partner alloted"}</div>
        <div class="wa_number">${d.daynaiwalaFirstNumber === "null" ? "--" : d.daynaiwalaFirstNumber}</div>
      </div>

      <div class="profile">
        <div class="avatar">
          <span class="pin">PIN :  ${d.otp_second}</span>
          <img src="profile.png">
          <span class="badge" style="display:${d.paymentStatusSecond === "false" ? "none" : "inline"}">✔</span>
        </div>
        <div class="amount">${d.daynaiwalaSecondAmount || "---"}</div>
        <div class="status">${String(d.daynaiwalaSecondUsdid) === "null" ? "Pending" : "Partner alloted"}</div>
        <div class="wa_number">${d.daynaiwalaSecondNumber === "null" ? "--" : d.daynaiwalaSecondNumber}</div>
      </div>

    </div>

    <div class="hint">Tap on number to chat directly with your partner</div>
    <div class="uid">UID: ${his_did}</div>
  `;
}


/* CANCEL */
function buildCardCancel(d) {
  return `
    <div class="row">
      <div class="company">${d.name || "Company"}</div>
      <div class="top-right gray">Cancelled</div>
    </div>
    <div class="divider"></div>
    <div class="hint">This trade was cancelled</div>
    <div class="uid">UID: ${usDid}</div>
  `;
}

/* INCOMPLETE POSITIVE */
function buildCardIncompletePositive(d) {
  return `
    <div class="row">
      <div class="company">${d.name || "Company"}</div>
      <div class="top-right green">₹ ${d.result || "---"}</div>
    </div>
    <div class="divider"></div>
    <div class="hint">This profit trade is incomplete</div>
    ${partnersUI(d)}
  `;
}

/* DEFAULT */
function buildCardDefault(d) {
  return `
    <div class="row">
      <div class="company">${d.name || "Company"}</div>
      <div class="top-right gray">₹ ${d.result || "---"}</div>
    </div>
    <div class="divider"></div>
    <div class="hint">Trade status unknown</div>
  `;
}

function partnersUI(d) {
  return `
    <div class="dist">
      <div>Profit Distribution</div>
      <span class="tick green">✔</span>
    </div>
    <div class="profiles">
      ${[1,2,3].map(i => `
        <div class="profile">
          <div class="avatar">
            <img src="profile.png">
            <span class="badge" style="display:${d['tick'+i] ? 'inline' : 'none'}">✔</span>
          </div>
          <div class="amount">₹ ${d['amount'+i] || "---"}</div>
          <div class="status">${d['status'+i] || "Pending"}</div>
          <button class="btn" style="display:${d['settle'+i] ? 'inline-block' : 'none'}">Settle</button>
        </div>
      `).join("")}
    </div>
    <div class="hint">Tap on number to chat direct with your partner</div>
    <div class="uid">UID: ${usDid}</div>
  `;
}

loadTrades();
</script>
</body>
</html>
