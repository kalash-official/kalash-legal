<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trade History</title>

<style>
body {
  font-family: "Inter", Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
  margin: 0;
}

.list {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
}

.card {
  background: #ffffff;
  border-radius: 18px;
  padding: 18px;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.company {
  font-size: 17px;
  font-weight: 700;
  color: #1f2937;
}

.top-right {
  font-size: 13px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 10px;
}

.green { color: #16a34a; background: #e7f8ee; }
.red { color: #dc2626; background: #fdeaea; }
.gray { color: #6b7280; background: #f1f5f9; }

.divider {
  height: 1px;
  background: #e5e7eb;
  margin: 14px 0;
}

.muted {
  color: #6b7280;
  font-size: 12px;
}

.label {
  color: #374151;
  font-size: 13px;
  font-weight: 600;
}

.profit {
  font-size: 15px;
  font-weight: 700;
}

.dist {
  margin-top: 14px;
  font-size: 14px;
  font-weight: 700;
  color: #111827;
}

.profiles {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;
  padding: 14px;
  background: #f9fafb;
  border-radius: 14px;
  justify-content: center;
}

.profile {
  flex: 1 1 120px;
  max-width: 150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.profile > * {
  margin-top: 6px;
}

.profile > *:first-child {
  margin-top: 0;
}

.avatar {
  position: relative;
  display: inline-block;
  padding-top: 14px;
  margin-bottom: 4px;
}

.avatar img {
  width: clamp(44px, 12vw, 54px);
  height: clamp(44px, 12vw, 54px);
  border-radius: 50%;
  border: 2px solid #e5e7eb;
}

.pin {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  background: #d1fae5;
  color: #065f46;
  font-size: clamp(8px, 2vw, 9px);
  padding: 2px 6px;
  border-radius: 10px;
  font-weight: 600;
  border: 1px solid #6ee7b7;
  white-space: nowrap;
}

.badge {
  position: absolute;
  bottom: -6px;
  right: -6px;
  background: #16a34a;
  color: #fff;
  border-radius: 50%;
  padding: 2px 5px;
  font-size: 10px;
  border: 2px solid #fff;
  display: none;
}

.amount {
  font-size: 13px;
  font-weight: 600;
  color: #111827;
}

.status {
  font-size: 11px;
  color: #6b7280;
}

.find-partner-btn {
  padding: 4px 10px;
  border-radius: 6px;
  border: none;
  background: linear-gradient(135deg, #4CAF50, #2E7D32);
  color: white;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  transition: all 0.12s ease;
}

.find-partner-btn:hover {
  transform: translateY(-0.5px);
  box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}

.find-partner-btn:active {
  transform: scale(0.96);
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.wa-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 11px;
  color: #16a34a;
  text-decoration: none;
  font-weight: 500;
  margin-top: 2px;
}

.wa-link:hover {
  text-decoration: underline;
  opacity: 0.9;
}

.wa-icon {
  width: 12px;
  height: 12px;
}

.wa_number {
  font-size: 11px;
  color: #4b5563;
}

.hint {
  margin-top: 14px;
  text-align: center;
  color: #6b7280;
  font-size: 11px;
}

.uid {
  margin-top: 10px;
  color: #9ca3af;
  font-weight: 500;
  font-size: 11px;
  text-align: center;
}

/* Mobile */
@media (max-width: 600px) {
  body { padding: 6px; }
  .card { max-width: 100%; border-radius: 14px; }
  .company { font-size: 15px; }
  .top-right { font-size: 11px; padding: 3px 8px; }
  .profiles { padding: 10px; gap: 8px; }
  .amount { font-size: 12px; }
  .status, .wa_number { font-size: 10px; }
  .hint, .uid { font-size: 10px; }
}

/* Very small phones */
@media (max-width: 360px) {
  body { padding: 4px; }
  .card { padding: 12px; }
  .company { font-size: 14px; }
  .profit { font-size: 13px; }
}

/* Large screens */
@media (min-width: 900px) {
  .card { max-width: 460px; }
}


</style>
</head>

<div class="list" id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUTZtR_9sM-EXq-AChMtYNh-XBpHXFs3E",
  authDomain: "kalash2-2bf90.firebaseapp.com",
  projectId: "kalash2-2bf90",
  storageBucket: "kalash2-2bf90.firebasestorage.app",
  messagingSenderId: "462798382911",
  appId: "1:462798382911:web:0cb93d05089de80dd3d58a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const list = document.getElementById("list");
const usDid = localStorage.getItem("us_did");

async function loadTrades() {
  const snap = await getDocs(collection(db, "users_setting", usDid, "trade_history"));

  if (snap.empty) {
    list.innerHTML = "<p style='text-align:center;color:#777;'>No trades found</p>";
    return;
  }

  snap.forEach(doc => {
    const d = doc.data();
    const his_did = doc.id;
    let html = "";

    if (d.result === "positive") html = buildCardPositive(d, his_did);
    else if (d.result === "negative" || d.result === "incomplete negative") html = buildCardNegative(d, his_did);
    else if (d.result === "cancel") html = buildCardCancel(d, his_did);
    else if (d.result === "incomplete positive") html = buildCardIncompletePositive(d, his_did);
    else html = buildCardDefault(d, his_did);

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = html;
    list.appendChild(card);
  });
}

/* INCOMPLETE POSITIVE */
function buildCardIncompletePositive(d) {
  return `
    <div class="row">
      <div class="company">${d.name || "Company"}</div>
      <div class="top-right green">₹ ${d.result || "---"}</div>
    </div>
    <div class="divider"></div>
    <div class="hint">This profit trade is incomplete</div>
    ${partnersUI(d)}
  `;
}

/* DEFAULT */
function buildCardDefault(d) {
  return `
    <div class="row">
      <div class="company">${d.name || "Company"}</div>

    <div class="divider"></div>
    <div class="hint">Trade status unknown</div>

}

          <div class="avatar">
            <img src="profile.png">
            <span class="badge" style="display:${d['tick'+i] ? 'inline' : 'none'}">✔</span>
          </div>
          <div class="amount">₹ ${d['amount'+i] || "---"}</div>
          <div class="status">${d['status'+i] || "Pending"}</div>
          <button class="btn" style="display:${d['settle'+i] ? 'inline-block' : 'none'}">Settle</button>
        </div>
      `).join("")}
    </div>
    <div class="hint">Tap on number to chat direct with your partner</div>
    <div class="uid">UID: ${usDid}</div>
  `;
}

loadTrades();
