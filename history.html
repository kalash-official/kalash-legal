<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trade History</title>

<style>
body { font-family: Arial,sans-serif; background:#f3f3f3; padding:16px; }
.list { display:flex; flex-direction:column; gap:12px; }
.card { background:white; border-radius:12px; padding:16px; max-width:480px; margin:auto; box-shadow:0 2px 6px rgba(0,0,0,0.12); }
.row { display:flex; justify-content:space-between; align-items:center; }
.company { font-size:18px; font-weight:700; max-width:70%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top-right { font-weight:600; }
.green { color:#4CAF50; }
.red { color:#E53935; }
.gray { color:#888; }
.divider { height:1px; background:#eee; margin:12px 0; }
.muted { color:#666; font-size:13px; }
.label { color:#333; font-size:14px; }
.profit { font-size:14px; font-weight:bold; }
.dist { margin-top:12px; font-size:16px; font-weight:600; display:flex; justify-content:space-between; }
.tick { font-size:18px; }
.profiles { display:flex; justify-content:space-between; margin-top:12px; padding:12px; background:#fafafa; border-radius:8px; }
.profile { text-align:center; flex:1; }
.avatar { position:relative; display:inline-block; }
.avatar img { width:48px; height:48px; border-radius:50%; }
.badge { position:absolute; top:-4px; right:-4px; background:white; border-radius:50%; padding:2px 4px; font-size:10px; border:1px solid #ddd; display:none; }
.amount { font-size:13px; margin-top:6px; }
.status { font-size:12px; margin-top:4px; }
.btn { margin-top:6px; background:#4CAF50; border:none; color:white; padding:6px 14px; border-radius:18px; font-size:12px; display:none; }
.hint { margin-top:12px; text-align:center; color:#777; font-size:13px; }
.uid { margin-top:12px; color:#666; font-weight:bold; font-size:13px; }
</style>
</head>

<body>
<div class="list" id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUTZtR_9sM-EXq-AChMtYNh-XBpHXFs3E",
  authDomain: "kalash2-2bf90.firebaseapp.com",
  projectId: "kalash2-2bf90",
  storageBucket: "kalash2-2bf90.firebasestorage.app",
  messagingSenderId: "462798382911",
  appId: "1:462798382911:web:0cb93d05089de80dd3d58a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const list = document.getElementById("list");
const usDid = localStorage.getItem("us_did");

async function loadTrades() {
  const snap = await getDocs(collection(db, "users_setting", usDid, "trade_history"));

  if (snap.empty) {
    list.innerHTML = "<p style='text-align:center;color:#777;'>No trades found</p>";
    return;
  }

  snap.forEach(doc => {
    const d = doc.data();
    let html = "";

    if (d.result === "positive") html = buildCardPositive(d);
    else if (d.result === "negative" || d.result === "incomplete negative") html = buildCardNegative(d);
    else if (d.result === "cancel") html = buildCardCancel(d);
    else if (d.result === "incomplete positive") html = buildCardIncompletePositive(d);
    else html = buildCardDefault(d);

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = html;
    list.appendChild(card);
  });
}

/* POSITIVE */
function buildCardPositive(d) {
  return `
    <div class="row">
      <div class="company">${d.name || "Company"}</div>
      <div class="top-right green">₹ ${d.result || "---"}</div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="muted">Entry: ${d.entry_at || "---"}</div>
      <div class="muted">Exit: ${d.exit_at || "---"}</div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="label">Profit</div>
      <div class="profit green">₹ ${d.profit || "---"}</div>
    </div>
    ${partnersUI(d)}
  `;
}

/* NEGATIVE */
function buildCardNegative(d) {
  return `
    <div class="row">
      <div class="company">${d.name || "Company"}</div>
      <div class="top-right red">${d.result || "---"}</div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="muted">Entry: ${d.entry_at || "---"}</div>
      <div class="muted">Exit: ${d.exit_at || "---"}</div>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div class="label">Loss</div>
      <div class="profit red">${d.profit || "---"}</div>
    </div>
    <div class="dist">
      <div>Loss Distribution</div>
      <span class="tick green">✔</span>
    </div>
    <div class="profiles">
        <div class="profile">
          <div class="avatar">
            <img src="profile.png">
            <span class="badge" style="display:${d['tick'+i] ? 'inline' : 'none'}">✔</span>
          </div>
          <div class="amount">₹ ${d['amount'+i] || "---"}</div>
          <div class="status">${d['status'+i] || "Pending"}</div>
          <button class="btn" style="display:${d['settle'+i] ? 'inline-block' : 'none'}">Settle</button>
        </div>
    </div>
    <div class="hint">Tap on number to chat direct with your partner</div>
    <div class="uid">UID: ${usDid}</div>
  `;
}

/* CANCEL */
function buildCardCancel(d) {
  return `
    <div class="row">
      <div class="company">${d.name || "Company"}</div>
      <div class="top-right gray">Cancelled</div>
    </div>
    <div class="divider"></div>
    <div class="hint">This trade was cancelled</div>
    <div class="uid">UID: ${usDid}</div>
  `;
}

/* INCOMPLETE POSITIVE */
function buildCardIncompletePositive(d) {
  return `
    <div class="row">
      <div class="company">${d.name || "Company"}</div>
      <div class="top-right green">₹ ${d.result || "---"}</div>
    </div>
    <div class="divider"></div>
    <div class="hint">This profit trade is incomplete</div>
    ${partnersUI(d)}
  `;
}

/* DEFAULT */
function buildCardDefault(d) {
  return `
    <div class="row">
      <div class="company">${d.name || "Company"}</div>
      <div class="top-right gray">₹ ${d.result || "---"}</div>
    </div>
    <div class="divider"></div>
    <div class="hint">Trade status unknown</div>
  `;
}

function partnersUI(d) {
  return `
    <div class="dist">
      <div>Profit Distribution</div>
      <span class="tick green">✔</span>
    </div>
    <div class="profiles">
      ${[1,2,3].map(i => `
        <div class="profile">
          <div class="avatar">
            <img src="profile.png">
            <span class="badge" style="display:${d['tick'+i] ? 'inline' : 'none'}">✔</span>
          </div>
          <div class="amount">₹ ${d['amount'+i] || "---"}</div>
          <div class="status">${d['status'+i] || "Pending"}</div>
          <button class="btn" style="display:${d['settle'+i] ? 'inline-block' : 'none'}">Settle</button>
        </div>
      `).join("")}
    </div>
    <div class="hint">Tap on number to chat direct with your partner</div>
    <div class="uid">UID: ${usDid}</div>
  `;
}

loadTrades();
</script>
</body>
</html>
