
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profit Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            max-width: 420px;
            margin: auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header .company {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .header .price {
            color: #2e7d32;
            font-weight: bold;
            font-size: 14px;
        }

        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 12px 0;
        }

        .profit-value {
            color: #4caf50;
            font-weight: bold;
        }

        .dist {
            margin-top: 12px;
        }

        .dist-text {
            font-size: 16px;
            font-weight: bold;
        }

        .tick {
            color: #4caf50;
            font-size: 14px;
        }

        .profiles {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding: 12px;
            background: #fafafa;
            border-radius: 8px;
        }

        .profile {
            text-align: center;
            flex: 1;
        }

        .avatar {
            position: relative;
            display: inline-block;
        }

        .avatar img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }

        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: white;
            border-radius: 50%;
            padding: 2px 4px;
            font-size: 10px;
            color: #4caf50;
            border: 1px solid #ddd;
        }

        .amount {
            color: #2e7d32;
            font-size: 13px;
            margin-top: 6px;
        }

        .status {
            margin-top: 4px;
            font-size: 12px;
            color: #444;
        }

        .btn {
            margin-top: 6px;
            background: #4caf50;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn:hover {
            background: #43a047;
        }

        .hint {
            margin-top: 12px;
            font-size: 13px;
            text-align: center;
            color: #777;
        }

        .uid {
            margin-top: 12px;
            font-weight: bold;
            color: #666;
        }
    </style>
</head>
<body>

<div class="card">

    <!-- HEADER -->
    <div class="row header">
        <div class="company">Company Name</div>
        <div class="price">₹ ---</div>
    </div>

    <div class="divider"></div>

    <!-- ENTRY EXIT -->
    <div class="row">
        <div class="entry">Entry: ₹ ---</div>
        <div class="exit">Exit: ₹ ---</div>
    </div>

    <div class="divider"></div>

    <!-- PROFIT -->
    <div class="row">
        <div>Profit</div>
        <div class="profit-value">₹ ---</div>
    </div>

    <!-- DISTRIBUTION -->
    <div class="row dist">
        <div class="dist-text">Profit Distribution</div>
        <div class="tick">✔</div>
    </div>

    <!-- PROFILES -->
    <div class="profiles">

        <div class="profile">
            <div class="avatar">
                <img src="profile.png" alt="">
                <span class="badge">✔</span>
            </div>
            <div class="amount">₹ ---</div>
            <div class="status">Pending</div>
            <button class="btn">Settle</button>
        </div>

        <div class="profile">
            <div class="avatar">
                <img src="profile.png" alt="">
                <span class="badge">✔</span>
            </div>
            <div class="amount">₹ ---</div>
            <div class="status">Pending</div>
            <button class="btn">Settle</button>
        </div>

        <div class="profile">
            <div class="avatar">
                <img src="profile.png" alt="">
                <span class="badge">✔</span>
            </div>
            <div class="amount">₹ ---</div>
            <div class="status">Pending</div>
            <button class="btn">Settle</button>
        </div>

    </div>

    <div class="hint">Tap Settle to complete partner payment</div>
    <div class="uid">UID: ABC123456</div>

</div>

    <script>
    // Read previously stored UID
    const storedUid = localStorage.getItem("user_uid");

    if (storedUid) {
        alert("Stored UID from localStorage: " + storedUid);
    } else {
        alert("No UID found in localStorage");
    }
</script>


</body>
</html>
