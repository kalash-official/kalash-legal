<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Lock</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 32px 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .card h2 {
            margin-bottom: 24px;
            color: #333;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #0072ff;
            box-shadow: 0 0 0 2px rgba(0,114,255,0.15);
        }

        .btn {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            background: #0072ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #005fe0;
        }

        .footer {
            margin-top: 16px;
            font-size: 12px;
            color: #777;
        }

        @media (max-width: 400px) {
            .card {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Modern Lock</h2>

    <div class="input-group">
        <input type="tel" placeholder="Mobile Number" required>
    </div>

    <div class="input-group">
        <input type="password" placeholder="Password" required>
    </div>

    <button class="btn">Unlock</button>

    <div class="footer">
        Secure access system
    </div>
</div>

</body>
</html>
