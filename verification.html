<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalash Lock</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(180deg, #f9f4ec, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 28px 24px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .logo {
            width: 140px;
            max-width: 70%;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0 0 20px;
            font-size: 22px;
            color: #333;
        }

        .input-group {
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            padding: 14px 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #8b1c0f;
            box-shadow: 0 0 0 2px rgba(139, 28, 15, 0.15);
        }

        .btn {
            margin-top: 8px;
            width: 100%;
            padding: 14px;
            background: #8b1c0f;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #6f150b;
        }

        .footer {
            margin-top: 14px;
            font-size: 12px;
            color: #777;
        }

        @media (max-width: 400px) {
            .card {
                padding: 22px 18px;
            }
            .logo {
                width: 120px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <img src="kalash.jpg" alt="Kalash Logo" class="logo">

    <h2>Secure Access</h2>

    <div class="input-group">
        <input id="phone" type="tel" placeholder="Mobile Number" required>
    </div>

    <div class="input-group">
        <input id="password" type="password" placeholder="Password" required>
    </div>

    <button class="btn" onclick="loginUser()">Unlock</button>

    <div class="footer">
        Trade ka insurance — Secure system
    </div>
</div>

<!-- Firebase logic added below -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUTZtR_9sM-EXq-AChMtYNh-XBpHXFs3E",
  authDomain: "kalash2-2bf90.firebaseapp.com",
  projectId: "kalash2-2bf90",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.loginUser = async function () {
  const phone = document.getElementById("phone").value.trim();
  const pass = document.getElementById("password").value.trim();

  if (!phone || !pass) {
    alert("Enter phone and password");
    return;
  }

  const q = query(
    collection(db, "users_setting"),
    where("number", "==", phone)
  );

  const snapshot = await getDocs(q);

  if (snapshot.empty) {
    alert("User not found");
    return;
  }

  const userDoc = snapshot.docs[0].data();

  if (userDoc.password !== pass) {
    alert("Wrong password");
    return;
  }

  window.location.href = "history.html";
};
</script>


</body>
</html>
